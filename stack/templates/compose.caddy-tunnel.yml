# Rendered by bootstrap.sh — app proxy behind the Cloudflare Tunnel (no open ports)
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ${STACK_DIR}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STACK_DIR}/caddy/sites:/etc/caddy/sites:ro
    networks: [edge]

networks:
  edge: { external: true }
