# Example caller for a backend repo (.github/workflows/deploy.yml).
# bin/onboard-repo.sh writes this for you and sets the BAO_ADDR and DEPLOY_TARGET repo variables.
name: deploy
on:
  push: { branches: [main] }   # with --gate-on-ci: `workflow_call:` instead, called from the repo's CI
  workflow_dispatch:
permissions: { contents: read, packages: write, id-token: write }
jobs:
  backend:
    uses: your-github-user/infra/.github/workflows/deploy-backend.yml@main
    with:
      bao_addr: ${{ vars.BAO_ADDR }}
      target: ${{ vars.DEPLOY_TARGET }}     # a name registered with bin/register-target
      # port: "3000"                        # default 8080
      # health_path: "/api/health"          # must return 2xx on the edge network before the deploy counts;
      #                                     # default "" = container-state checks only (recommended to set)
      # health_timeout: "90"                # seconds to wait for the new container to be healthy
      # health_stable: "10"                 # seconds it must stay up with no restarts
