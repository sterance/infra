# Example caller for a frontend repo (.github/workflows/deploy.yml).
# bin/onboard-repo.sh writes this for you; it also sets the BAO_ADDR repo variable.
name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, id-token: write }
jobs:
  pages:
    uses: your-github-user/infra/.github/workflows/deploy-pages.yml@main
    with:
      bao_addr: ${{ vars.BAO_ADDR }}
      # subdomain: www          # default: repo name
      # output_dir: build       # default: dist
