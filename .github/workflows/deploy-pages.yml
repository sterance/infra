# Reusable: build a frontend and deploy it to Cloudflare Pages at <subdomain>.<DOMAIN>.
# Callers are generated by bin/onboard-repo.sh. Every value except BAO_ADDR comes from OpenBao.
name: deploy-pages
on:
  workflow_call:
    inputs:
      bao_addr:      { type: string, required: true }      # caller passes ${{ vars.BAO_ADDR }}
      subdomain:     { type: string, default: "" }         # default: repo name
      build_command: { type: string, default: "npm ci && npm run build" }
      output_dir:    { type: string, default: "dist" }
      node_version:  { type: string, default: "22" }

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      BAO_ADDR: ${{ inputs.bao_addr }}
    steps:
      - uses: actions/checkout@v4

      - name: Names
        run: |
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' \
                 | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g')
          SUB="${{ inputs.subdomain }}"
          echo "PROJECT=$REPO"     >> "$GITHUB_ENV"
          echo "SUB=${SUB:-$REPO}" >> "$GITHUB_ENV"

      - name: OpenBao login + shared secrets
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: ${{ inputs.bao_addr }}
          method: jwt
          role: deploy
          jwtGithubAudience: openbao
          exportToken: true
          secrets: |
            kv/data/shared/cloudflare api_token  | CLOUDFLARE_API_TOKEN ;
            kv/data/shared/cloudflare account_id | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/shared/cloudflare zone_id    | CF_ZONE_ID ;
            kv/data/shared/cloudflare domain     | DOMAIN

      - name: App build variables (kv/apps/<owner>/<repo>/prod, optional)
        run: |
          JSON=$(curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" \
                 "$BAO_ADDR/v1/kv/data/apps/${{ github.repository }}/prod" || echo '{}')
          jq -c '.data.data // {} | to_entries[]' <<<"$JSON" | while read -r e; do
            k=$(jq -r .key <<<"$e"); v=$(jq -r .value <<<"$e")
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-node@v7
        with: { node-version: "${{ inputs.node_version }}" }

      - name: Build
        run: ${{ inputs.build_command }}

      - name: Deploy to Pages
        run: |
          npx -y wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          npx -y wrangler@4 pages deploy "${{ inputs.output_dir }}" --project-name="$PROJECT" --branch=main

      - name: Custom domain + DNS
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          P="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          HOST="$SUB.$DOMAIN"
          curl -sS -X POST -H "$AUTH" -H 'Content-Type: application/json' "$P/domains" \
               -d "{\"name\":\"$HOST\"}" | jq -c '{success, errors}'      # "already exists" is fine
          PAGES_HOST=$(curl -fsS -H "$AUTH" "$P" | jq -r .result.subdomain)

          Z="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records"
          BODY=$(jq -n --arg n "$HOST" --arg c "$PAGES_HOST" '{type:"CNAME",name:$n,content:$c,proxied:true,ttl:1}')
          ID=$(curl -fsS -H "$AUTH" "$Z?name=$HOST" | jq -r '.result[0].id // empty')
          if [ -n "$ID" ]; then
            curl -fsS -X PUT  -H "$AUTH" -H 'Content-Type: application/json' "$Z/$ID" -d "$BODY" >/dev/null
          else
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' "$Z" -d "$BODY" >/dev/null
          fi
          echo "### Deployed to https://$HOST" >> "$GITHUB_STEP_SUMMARY"
