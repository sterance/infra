# Reusable: build a backend image, push to GHCR, deploy it to a named target at <repo>-backend.<DOMAIN>.
#
# Targets are registered with bin/register-target and stored at kv/shared/targets/<name>:
#   mode=public  host, known_hosts, platform              → SSH straight to the server, app on public :443
#   mode=tunnel  tunnel_id, ssh_host, known_hosts, platform → SSH through the Cloudflare Tunnel (Access
#                                                           service token from kv/shared/cloudflare-access)
# Both deploy from GitHub's runners as user 'deploy' with a 10-minute OpenBao-signed SSH certificate,
# so no self-hosted runner is needed and public repos are safe to deploy.
# Callers are generated by bin/onboard-repo.sh.
#
# A deploy only succeeds if the new container is running, stable and (with health_path) answering 2xx on
# the shared 'edge' network. Otherwise the previous compose.yml/app.env/image is put back, the failure is
# printed with the container's logs, and the job fails, even when the rollback is healthy.
name: deploy-backend
on:
  workflow_call:
    inputs:
      bao_addr: { type: string, required: true }   # caller passes ${{ vars.BAO_ADDR }}
      target:   { type: string, required: true }   # caller passes ${{ vars.DEPLOY_TARGET }}
      port:       { type: string, default: "8080" }       # port the app listens on ($PORT)
      dockerfile: { type: string, default: "Dockerfile" } # path from the repo root
      context:    { type: string, default: "." }          # docker build context
      data_dir:   { type: string, default: "" }           # container path to persist, e.g. /app/data
      subdomain:  { type: string, default: "" }           # default: <repo>-backend
      health_path:    { type: string, default: "" }   # e.g. /api/health, must return 2xx; "" = container-state checks only
      health_timeout: { type: string, default: "90" } # seconds to wait for the new container to become healthy
      health_stable:  { type: string, default: "10" } # seconds it must stay up with no restarts to count as healthy

# Two deploys of the same app to the same target never interleave their rollback bookkeeping.
# (GitHub keeps one pending run per group: a third queued deploy replaces the waiting second one.)
concurrency:
  group: deploy-backend-${{ github.repository }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: { id-token: write }
    outputs:
      mode:     ${{ steps.target.outputs.mode }}
      platform: ${{ steps.target.outputs.platform }}
    steps:
      # Log in only: values vault-action reads are masked, and GitHub drops masked job outputs
      - name: OpenBao login
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ inputs.bao_addr }}
          method: jwt
          role: deploy
          jwtGithubAudience: openbao
          exportToken: true

      - name: Look up target '${{ inputs.target }}'
        id: target
        env:
          BAO_ADDR: ${{ inputs.bao_addr }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          T=$(curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" "$BAO_ADDR/v1/kv/data/shared/targets/$TARGET") \
            || { echo "::error::No target '$TARGET' in OpenBao (bin/register-target --list)"; exit 1; }
          MODE=$(jq -r '.data.data.mode // empty' <<<"$T")
          PLATFORM=$(jq -r '.data.data.platform // "linux/amd64"' <<<"$T")
          [ "$MODE" = tunnel ] || [ "$MODE" = public ] || { echo "::error::Target '$TARGET' has mode '$MODE'"; exit 1; }
          echo "mode=$MODE"         >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "Target $TARGET: $MODE, $PLATFORM"

  build:
    needs: plan
    # arm64 images build natively on GitHub's ARM runners for public repos; private repos use QEMU emulation
    runs-on: ${{ (needs.plan.outputs.platform == 'linux/arm64' && !github.event.repository.private) && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ needs.plan.outputs.platform }}
          tags: ${{ steps.img.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      BAO_ADDR: ${{ inputs.bao_addr }}
      MODE: ${{ needs.plan.outputs.mode }}
      PORT: ${{ inputs.port }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: OpenBao login + shared secrets
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ inputs.bao_addr }}
          method: jwt
          role: deploy
          jwtGithubAudience: openbao
          exportToken: true
          secrets: |
            kv/data/shared/cloudflare api_token | CLOUDFLARE_API_TOKEN ;
            kv/data/shared/cloudflare zone_id   | CF_ZONE_ID ;
            kv/data/shared/cloudflare domain    | DOMAIN ;
            kv/data/shared/ghcr username        | GHCR_USER ;
            kv/data/shared/ghcr token           | GHCR_TOKEN

      - name: Prepare bundle
        run: |
          set -euo pipefail
          [ "$MODE" = tunnel ] || [ "$MODE" = public ] || { echo "::error::Deploy mode is '$MODE' (expected tunnel or public)"; exit 1; }
          bao_get() { curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" "$BAO_ADDR/v1/kv/data/$1"; }
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' \
                 | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g')
          SUB="${{ inputs.subdomain }}"; HOST="${SUB:-$REPO-backend}.$DOMAIN"
          echo "REPO=$REPO" >> "$GITHUB_ENV"; echo "HOST=$HOST" >> "$GITHUB_ENV"

          T=$(bao_get "shared/targets/${{ inputs.target }}")
          for k in host ssh_host known_hosts tunnel_id; do
            v=$(jq -r --arg k "$k" '.data.data[$k] // empty' <<<"$T")
            echo "TARGET_${k^^}<<__EOF__" >> "$GITHUB_ENV"; echo "$v" >> "$GITHUB_ENV"; echo "__EOF__" >> "$GITHUB_ENV"
          done
          echo "STACK_DIR=$(jq -r '.data.data.stack_dir // "/opt/stack"' <<<"$T")" >> "$GITHUB_ENV"
          echo "APPS_DIR=$(jq -r '.data.data.apps_dir // "/opt/apps"' <<<"$T")"    >> "$GITHUB_ENV"

          B="$RUNNER_TEMP/bundle"; rm -rf "$B"; mkdir -p "$B"; chmod 700 "$B"
          echo "BUNDLE=$B" >> "$GITHUB_ENV"
          : > "$B/app.env"; chmod 600 "$B/app.env"
          APP=$(bao_get "apps/${{ github.repository }}/prod" 2>/dev/null || echo '{}')
          jq -c '.data.data // {} | to_entries[]' <<<"$APP" | while read -r e; do
            k=$(jq -r .key <<<"$e"); v=$(jq -r .value <<<"$e")
            echo "::add-mask::$v"; echo "$k=$v" >> "$B/app.env"
          done
          echo "$(wc -l < "$B/app.env") app variables"

          cat > "$B/compose.yml" <<EOF
          services:
            app:
              image: $IMAGE
              container_name: $REPO
              restart: unless-stopped
              env_file: app.env
              environment: { PORT: "$PORT" }
              networks: [edge]
          networks:
            edge: { external: true }
          EOF
          DATA_DIR="${{ inputs.data_dir }}"
          if [ -n "$DATA_DIR" ]; then
            # persisted at <apps_dir>/<repo>/data on the server; survives redeploys
            sed -i "s#^    networks: \[edge\]#    volumes: [\"./data:$DATA_DIR\"]\n    networks: [edge]#" "$B/compose.yml"
          fi
          if [ "$MODE" = tunnel ]; then
            printf 'http://%s {\n  reverse_proxy %s:%s\n}\n' "$HOST" "$REPO" "$PORT" > "$B/site.caddy"
          else
            printf 'https://%s {\n  tls /certs/origin.pem /certs/origin.key\n  reverse_proxy %s:%s\n}\n' \
              "$HOST" "$REPO" "$PORT" > "$B/site.caddy"
          fi

      - name: Deploy over SSH
        env:
          HEALTH_PATH: ${{ inputs.health_path }}
          HEALTH_TIMEOUT: ${{ inputs.health_timeout }}
          HEALTH_STABLE: ${{ inputs.health_stable }}
          TARGET_NAME: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$HEALTH_TIMEOUT" =~ ^[0-9]+$ && "$HEALTH_STABLE" =~ ^[0-9]+$ ]] \
            || { echo "::error::health_timeout and health_stable must be whole seconds"; exit 1; }
          (( HEALTH_TIMEOUT > HEALTH_STABLE )) \
            || { echo "::error::health_timeout ($HEALTH_TIMEOUT) must be longer than health_stable ($HEALTH_STABLE)"; exit 1; }
          [[ -z "$HEALTH_PATH" || "$HEALTH_PATH" == /* ]] \
            || { echo "::error::health_path must start with / (got '$HEALTH_PATH')"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TARGET_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          rm -f ~/.ssh/deploy ~/.ssh/deploy.pub
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/deploy
          jq -n --arg k "$(cat ~/.ssh/deploy.pub)" '{public_key:$k, valid_principals:"deploy"}' \
            | curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" -X POST -d @- "$BAO_ADDR/v1/ssh/sign/deploy" \
            | jq -r .data.signed_key > ~/.ssh/deploy-cert.pub

          # Explicit paths + ssh -F: ssh resolves ~ from the passwd entry, not $HOME
          SSHCFG="$HOME/.ssh/deploy_config"
          {
            echo "Host target"
            echo "  User deploy"
            echo "  IdentityFile $HOME/.ssh/deploy"
            echo "  CertificateFile $HOME/.ssh/deploy-cert.pub"
            echo "  IdentitiesOnly yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
          } > "$SSHCFG"
          if [ "$MODE" = tunnel ]; then
            # SSH rides the Cloudflare Tunnel; Access lets it through only with the service token
            CFA=$(curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" "$BAO_ADDR/v1/kv/data/shared/cloudflare-access")
            CF_ID=$(jq -r .data.data.client_id <<<"$CFA"); CF_SECRET=$(jq -r .data.data.client_secret <<<"$CFA")
            echo "::add-mask::$CF_SECRET"
            sudo curl -fsSL -o /usr/local/bin/cloudflared \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            sudo chmod +x /usr/local/bin/cloudflared
            {
              echo "  HostName $TARGET_SSH_HOST"
              echo "  ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET"
            } >> "$SSHCFG"
          else
            echo "  HostName $TARGET_HOST" >> "$SSHCFG"
          fi
          chmod 600 "$SSHCFG"
          ssh() { command ssh -F "$SSHCFG" "$@"; }

          # New files land beside the live ones as *.new; the script below saves the live ones as *.prev
          # before moving the new ones into place. The site file is only installed once the app is healthy.
          D="$APPS_DIR/$REPO"
          ssh target "mkdir -p $D && umask 077 && cat > $D/app.env.new" < "$BUNDLE/app.env"
          ssh target "cat > $D/compose.yml.new"                       < "$BUNDLE/compose.yml"
          ssh target "cat > $D/site.caddy.new"                        < "$BUNDLE/site.caddy"
          echo "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u $GHCR_USER --password-stdin >/dev/null"

          LOG="$RUNNER_TEMP/deploy.log"
          ARGS=$(printf '%q ' "$REPO" "$D" "$STACK_DIR/caddy/sites/$REPO.caddy" "$IMAGE" "$PORT" \
                   "$HEALTH_PATH" "$HEALTH_TIMEOUT" "$HEALTH_STABLE")
          set +e
          # Runs on the target in one SSH session. Values arrive as arguments, never interpolated into the
          # script. Everything is inside main() so bash has read the whole script before any command runs.
          ssh target "bash -s -- $ARGS" 2>&1 <<'REMOTE' | tee "$LOG"
          set -uo pipefail
          REPO=$1 D=$2 SITE=$3 IMAGE=$4 PORT=$5 HEALTH_PATH=$6 HEALTH_TIMEOUT=$7 HEALTH_STABLE=$8
          PROBE=curlimages/curl:8.11.1   # pinned; app images often lack curl, so probe from a throwaway container
          CADDY_RELOAD=(docker exec caddy caddy reload --config /etc/caddy/Caddyfile)

          finish() { echo "DEPLOY_RESULT=$1"; exit "$2"; }
          state()  { docker inspect "$REPO" --format '{{.State.Status}} {{.RestartCount}} {{.State.StartedAt}}' 2>/dev/null; }

          # Healthy = running (not restarting), RestartCount unchanged since the wait began, up for at least
          # HEALTH_STABLE seconds, and (with HEALTH_PATH) answering 2xx, all at once. Sets WHY when not.
          wait_healthy() {
            local deadline=$((SECONDS + HEALTH_TIMEOUT)) base="" st status rc started up code
            WHY="no container named $REPO"
            while (( SECONDS < deadline )); do
              if st=$(state); then
                read -r status rc started <<<"$st"
                [ -n "$base" ] || base=$rc
                if (( rc > base )); then
                  WHY="restarted $((rc - base)) time(s) during the health wait (crash loop)"; return 1
                fi
                if [ "$status" != running ]; then
                  WHY="status is '$status'"
                else
                  up=$(( $(date +%s) - $(date -d "$started" +%s) ))
                  if (( up < HEALTH_STABLE )); then
                    WHY="up ${up}s, needs ${HEALTH_STABLE}s without a restart"
                  elif [ -z "$HEALTH_PATH" ]; then
                    echo "$1: running ${up}s with no restarts (no health_path set)"; return 0
                  else
                    code=$(docker run --rm --network edge "$PROBE" -sS -o /dev/null -w '%{http_code}' \
                             --max-time 3 "http://$REPO:$PORT$HEALTH_PATH" 2>/dev/null)
                    if [[ "$code" == 2?? && "$(state)" == "running $base "* ]]; then
                      echo "$1: running ${up}s with no restarts, GET $HEALTH_PATH -> HTTP $code"; return 0
                    fi
                    WHY="GET http://$REPO:$PORT$HEALTH_PATH -> HTTP ${code:-000}"
                  fi
                fi
              fi
              sleep 2
            done
            WHY="not healthy within ${HEALTH_TIMEOUT}s: $WHY"; return 1
          }

          start_and_wait() {   # $1 = label
            if ! docker compose up -d --remove-orphans; then WHY="docker compose up failed"; return 1; fi
            wait_healthy "$1"
          }

          # State and logs of the failed container, captured before a rollback replaces it
          report() {
            local s stop
            echo "::error::$IMAGE failed the health check: $1"
            echo "DEPLOY_WHY=$1"
            s=$(docker inspect "$REPO" --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} restarts={{.RestartCount}} error="{{.State.Error}}"' 2>/dev/null) \
              || s="no container named $REPO"
            echo "DEPLOY_STATE=$s"
            stop=$(cat /proc/sys/kernel/random/uuid)
            echo "::stop-commands::$stop"   # app logs can't issue workflow commands
            echo "----- BEGIN LOGS $REPO (docker logs --tail 100) -----"
            docker logs --tail 100 "$REPO" 2>&1 || echo "(no logs)"
            echo "----- END LOGS $REPO -----"
            echo "::$stop::"
          }

          main() {
            local f prev_image="" running_image ref have_prev=0
            cd "$D" || finish aborted 14
            for f in compose.yml.new app.env.new site.caddy.new; do
              [ -f "$f" ] || { echo "::error::$D/$f was not uploaded"; finish aborted 14; }
            done

            # Pull first: if the image or the probe can't be fetched, nothing has changed yet
            docker pull -q "$IMAGE" >/dev/null \
              || { echo "::error::Could not pull $IMAGE; the running deployment is untouched"; finish aborted 14; }
            if [ -n "$HEALTH_PATH" ]; then
              docker pull -q "$PROBE" >/dev/null \
                || { echo "::error::Could not pull $PROBE; the running deployment is untouched"; finish aborted 14; }
            fi

            # 1. Remember the current deployment (one generation of *.prev is kept)
            running_image=$(docker inspect "$REPO" --format '{{.Config.Image}}' 2>/dev/null || true)
            if [ -f "$SITE" ]; then cp -p "$SITE" site.caddy.prev; else rm -f site.caddy.prev; fi
            if [ -f compose.yml ]; then
              have_prev=1
              cp -p compose.yml compose.yml.prev
              if [ -f app.env ]; then cp -p app.env app.env.prev; else rm -f app.env.prev; fi
              prev_image=$(sed -n 's/^ *image: *//p' compose.yml | head -n 1)   # what a rollback restores
              echo "Previous deployment: ${prev_image:-unknown image}"
            else
              rm -f compose.yml.prev app.env.prev
              echo "First deploy of $REPO on this target: nothing to roll back to"
            fi
            mv -f compose.yml.new compose.yml
            mv -f app.env.new app.env

            # 2 + 3. Start the new image and wait for it to be healthy
            echo "Starting $IMAGE (timeout ${HEALTH_TIMEOUT}s, stable ${HEALTH_STABLE}s${HEALTH_PATH:+, GET $HEALTH_PATH})"
            if start_and_wait "New container healthy"; then
              # 4. Publish the site file and reload Caddy
              cp site.caddy.new "$SITE" && rm -f site.caddy.new compose.yml.failed app.env.failed
              if ! "${CADDY_RELOAD[@]}"; then
                echo "::error::Caddy rejected the new site file; restored the previous one (the new container is running)"
                if [ -f site.caddy.prev ]; then cp site.caddy.prev "$SITE"; else rm -f "$SITE"; fi
                "${CADDY_RELOAD[@]}" || true
                finish caddy_reload_failed 13
              fi
              # Prune old tags of this app's image, keeping the new one and the one it replaced
              docker image ls "${IMAGE%:*}" --format '{{.Repository}}:{{.Tag}}' | while read -r ref; do
                case "$ref" in *:"<none>"|"$IMAGE"|"$prev_image"|"$running_image") continue ;; esac
                docker image rm "$ref" >/dev/null 2>&1 && echo "Pruned $ref"
              done
              finish healthy 0
            fi

            # 5. Not healthy
            report "$WHY"
            rm -f site.caddy.new   # the live site file was never replaced
            if (( have_prev )); then
              echo "Rolling back to ${prev_image:-the previous compose.yml}"
              cp -p compose.yml.prev compose.yml
              if [ -f app.env.prev ]; then cp -p app.env.prev app.env; fi
              if start_and_wait "Rollback healthy"; then
                echo "DEPLOY_ROLLBACK=healthy (${prev_image:-previous deployment})"
                finish rolled_back_healthy 10
              fi
              echo "::error::The rollback to ${prev_image:-the previous deployment} is not healthy either: $WHY"
              echo "DEPLOY_ROLLBACK=unhealthy (${prev_image:-previous deployment}): $WHY"
              finish rolled_back_unhealthy 11
            fi
            # First deploy: stop it so it doesn't restart-loop, and don't let the next deploy treat it as
            # a deployment to roll back to
            docker compose stop || true
            mv -f compose.yml compose.yml.failed
            mv -f app.env app.env.failed
            finish failed_no_previous 12
          }

          main "$@" </dev/null
          REMOTE
          rc=${PIPESTATUS[0]}
          set -e

          field() { sed -n "s/^DEPLOY_$1=//p" "$LOG" | tail -n 1; }
          RESULT=$(field RESULT); WHY=$(field WHY); STATE=$(field STATE); ROLLBACK=$(field ROLLBACK)
          # Masks don't apply to the step summary, so blank out app.env values in the logs written there
          redact() {
            local line v
            while IFS= read -r line; do
              while IFS= read -r v; do
                if [ "${#v}" -ge 4 ]; then line=${line//"$v"/***}; fi
              done < <(cut -d= -f2- "$BUNDLE/app.env")
              printf '%s\n' "$line"
            done
          }
          logs_block() {
            echo; echo "<details><summary>Last 30 log lines of the failed container</summary>"; echo
            echo '```text'
            awk '/^----- END LOGS /{f=0} f; /^----- BEGIN LOGS /{f=1}' "$LOG" | tail -n 30 | redact
            echo '```'; echo; echo "</details>"
          }
          S="$GITHUB_STEP_SUMMARY"
          case "$RESULT" in
            healthy)
              { echo "### ✅ Deployed to $TARGET_NAME: https://$HOST"
                echo "\`$IMAGE\` is healthy ($(grep -m1 '^New container healthy:' "$LOG" | cut -d: -f2- | sed 's/^ //'))."
              } >> "$S" ;;
            rolled_back_healthy|rolled_back_unhealthy)
              { echo "### ❌ Deploy to $TARGET_NAME failed and was rolled back"
                echo "- **New image** \`$IMAGE\`: $WHY"
                echo "- **Container state**: \`$STATE\`"
                echo "- **Rollback**: $ROLLBACK"
                logs_block
              } >> "$S" ;;
            failed_no_previous)
              { echo "### ❌ First deploy to $TARGET_NAME failed (nothing to roll back to)"
                echo "- **New image** \`$IMAGE\`: $WHY"
                echo "- **Container state**: \`$STATE\`"
                echo "- The container was stopped so it doesn't restart-loop."
                logs_block
              } >> "$S" ;;
            caddy_reload_failed)
              echo "### ❌ Deploy to $TARGET_NAME: the container is healthy but Caddy rejected the site file (previous one restored)" >> "$S" ;;
            aborted)
              echo "### ❌ Deploy to $TARGET_NAME aborted before anything changed (see the job log)" >> "$S" ;;
            *)
              echo "### ❌ Deploy to $TARGET_NAME: the deploy script exited with $rc and no result; check the target by hand" >> "$S" ;;
          esac
          if [ "$rc" -ne 0 ]; then
            echo "::error::Deploy result: ${RESULT:-unknown} (exit $rc)"
            exit 1
          fi

      - name: DNS
        run: |
          set -euo pipefail
          if [ "$MODE" = tunnel ]; then TYPE=CNAME; CONTENT="$TARGET_TUNNEL_ID.cfargotunnel.com"
          else TYPE=A; CONTENT="$TARGET_HOST"; fi
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          Z="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records"
          BODY=$(jq -n --arg t "$TYPE" --arg n "$HOST" --arg c "$CONTENT" '{type:$t,name:$n,content:$c,proxied:true,ttl:1}')
          ID=$(curl -fsS -H "$AUTH" "$Z?name=$HOST" | jq -r '.result[0].id // empty')
          if [ -n "$ID" ]; then
            curl -fsS -X PUT  -H "$AUTH" -H 'Content-Type: application/json' "$Z/$ID" -d "$BODY" >/dev/null
          else
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' "$Z" -d "$BODY" >/dev/null
          fi
          echo "DNS $TYPE $HOST -> $CONTENT (proxied)"

      # Informational only: Cloudflare Access or WAF rules can block GitHub's runners. The on-server
      # health check in the deploy step decides the result.
      - name: Smoke test
        run: |
          code=$(curl -sS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors -w '%{http_code}' "https://$HOST/" || true)
          echo "https://$HOST -> HTTP $code"
          if [[ "$code" =~ ^[23][0-9][0-9]$ ]]; then
            echo "Public smoke test: https://$HOST/ -> HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Public smoke test: https://$HOST/ returned HTTP ${code:-000} (blocked by Access/WAF, or a real problem; the on-server health check passed)"
            echo "⚠️ Public smoke test: https://$HOST/ -> HTTP ${code:-000} (warning only)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/deploy.log" ~/.ssh/deploy ~/.ssh/deploy.pub ~/.ssh/deploy-cert.pub ~/.ssh/deploy_config
