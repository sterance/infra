# Reusable: build a backend image, push to GHCR, deploy it to a named target at <repo>-backend.<DOMAIN>.
#
# Targets are registered with bin/register-target and stored at kv/shared/targets/<name>:
#   mode=public  host, known_hosts, platform   → deploy over SSH (10-min OpenBao cert), app on public :443
#   mode=tunnel  tunnel_id, platform           → deploy on a self-hosted runner labelled <name>, app via tunnel
# Callers are generated by bin/onboard-repo.sh.
name: deploy-backend
on:
  workflow_call:
    inputs:
      bao_addr: { type: string, required: true }   # caller passes ${{ vars.BAO_ADDR }}
      target:   { type: string, required: true }   # caller passes ${{ vars.DEPLOY_TARGET }}
      port:     { type: string, default: "8080" }  # port the app listens on ($PORT)

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: { id-token: write }
    outputs:
      mode:     ${{ steps.bao.outputs.MODE }}
      platform: ${{ steps.bao.outputs.PLATFORM }}
    steps:
      - name: Look up target '${{ inputs.target }}'
        id: bao
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ inputs.bao_addr }}
          method: jwt
          role: deploy
          jwtGithubAudience: openbao
          secrets: |
            kv/data/shared/targets/${{ inputs.target }} mode     | MODE ;
            kv/data/shared/targets/${{ inputs.target }} platform | PLATFORM

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: ${{ needs.plan.outputs.platform }}
          tags: ${{ steps.img.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [plan, build]
    runs-on: ${{ needs.plan.outputs.mode == 'tunnel' && fromJSON(format('["self-hosted","{0}"]', inputs.target)) || 'ubuntu-latest' }}
    permissions: { contents: read, id-token: write }
    env:
      BAO_ADDR: ${{ inputs.bao_addr }}
      MODE: ${{ needs.plan.outputs.mode }}
      PORT: ${{ inputs.port }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: OpenBao login + shared secrets
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ inputs.bao_addr }}
          method: jwt
          role: deploy
          jwtGithubAudience: openbao
          exportToken: true
          secrets: |
            kv/data/shared/cloudflare api_token | CLOUDFLARE_API_TOKEN ;
            kv/data/shared/cloudflare zone_id   | CF_ZONE_ID ;
            kv/data/shared/cloudflare domain    | DOMAIN ;
            kv/data/shared/ghcr username        | GHCR_USER ;
            kv/data/shared/ghcr token           | GHCR_TOKEN

      - name: Prepare bundle
        run: |
          set -euo pipefail
          bao_get() { curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" "$BAO_ADDR/v1/kv/data/$1"; }
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' \
                 | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g')
          HOST="$REPO-backend.$DOMAIN"
          echo "REPO=$REPO" >> "$GITHUB_ENV"; echo "HOST=$HOST" >> "$GITHUB_ENV"

          T=$(bao_get "shared/targets/${{ inputs.target }}")
          for k in host known_hosts tunnel_id; do
            v=$(jq -r --arg k "$k" '.data.data[$k] // empty' <<<"$T")
            echo "TARGET_${k^^}<<__EOF__" >> "$GITHUB_ENV"; echo "$v" >> "$GITHUB_ENV"; echo "__EOF__" >> "$GITHUB_ENV"
          done
          echo "STACK_DIR=$(jq -r '.data.data.stack_dir // "/opt/stack"' <<<"$T")" >> "$GITHUB_ENV"
          echo "APPS_DIR=$(jq -r '.data.data.apps_dir // "/opt/apps"' <<<"$T")"    >> "$GITHUB_ENV"

          B="$RUNNER_TEMP/bundle"; rm -rf "$B"; mkdir -p "$B"; chmod 700 "$B"
          echo "BUNDLE=$B" >> "$GITHUB_ENV"
          : > "$B/app.env"; chmod 600 "$B/app.env"
          APP=$(bao_get "apps/${{ github.repository }}/prod" 2>/dev/null || echo '{}')
          jq -c '.data.data // {} | to_entries[]' <<<"$APP" | while read -r e; do
            k=$(jq -r .key <<<"$e"); v=$(jq -r .value <<<"$e")
            echo "::add-mask::$v"; echo "$k=$v" >> "$B/app.env"
          done
          echo "$(wc -l < "$B/app.env") app variables"

          cat > "$B/compose.yml" <<EOF
          services:
            app:
              image: $IMAGE
              container_name: $REPO
              restart: unless-stopped
              env_file: app.env
              environment: { PORT: "$PORT" }
              networks: [edge]
          networks:
            edge: { external: true }
          EOF
          if [ "$MODE" = tunnel ]; then
            printf 'http://%s {\n  reverse_proxy %s:%s\n}\n' "$HOST" "$REPO" "$PORT" > "$B/site.caddy"
          else
            printf 'https://%s {\n  tls /certs/origin.pem /certs/origin.key\n  reverse_proxy %s:%s\n}\n' \
              "$HOST" "$REPO" "$PORT" > "$B/site.caddy"
          fi

      - name: Deploy over SSH (public target)
        if: env.MODE == 'public'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$TARGET_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          rm -f ~/.ssh/deploy ~/.ssh/deploy.pub
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/deploy
          jq -n --arg k "$(cat ~/.ssh/deploy.pub)" '{public_key:$k, valid_principals:"deploy"}' \
            | curl -fsS -H "X-Vault-Token: $VAULT_TOKEN" -X POST -d @- "$BAO_ADDR/v1/ssh/sign/deploy" \
            | jq -r .data.signed_key > ~/.ssh/deploy-cert.pub
          vps() { ssh -i ~/.ssh/deploy -o CertificateFile="$HOME/.ssh/deploy-cert.pub" "deploy@$TARGET_HOST" "$@"; }
          D="$APPS_DIR/$REPO"
          vps "mkdir -p $D && umask 077 && cat > $D/app.env"  < "$BUNDLE/app.env"
          vps "cat > $D/compose.yml"                        < "$BUNDLE/compose.yml"
          vps "cat > $STACK_DIR/caddy/sites/$REPO.caddy"    < "$BUNDLE/site.caddy"
          echo "$GHCR_TOKEN" | vps "docker login ghcr.io -u $GHCR_USER --password-stdin >/dev/null"
          vps "cd $D && docker compose pull -q && docker compose up -d --remove-orphans \
               && docker exec caddy caddy reload --config /etc/caddy/Caddyfile"

      - name: Deploy locally (tunnel target, self-hosted runner)
        if: env.MODE == 'tunnel'
        run: |
          set -euo pipefail
          D="$APPS_DIR/$REPO"
          mkdir -p "$D"
          install -m 600 "$BUNDLE/app.env" "$D/app.env"
          cp "$BUNDLE/compose.yml" "$D/compose.yml"
          cp "$BUNDLE/site.caddy" "$STACK_DIR/caddy/sites/$REPO.caddy"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          cd "$D" && docker compose pull -q && docker compose up -d --remove-orphans
          docker exec caddy caddy reload --config /etc/caddy/Caddyfile

      - name: DNS
        run: |
          set -euo pipefail
          if [ "$MODE" = tunnel ]; then TYPE=CNAME; CONTENT="$TARGET_TUNNEL_ID.cfargotunnel.com"
          else TYPE=A; CONTENT="$TARGET_HOST"; fi
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          Z="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records"
          BODY=$(jq -n --arg t "$TYPE" --arg n "$HOST" --arg c "$CONTENT" '{type:$t,name:$n,content:$c,proxied:true,ttl:1}')
          ID=$(curl -fsS -H "$AUTH" "$Z?name=$HOST" | jq -r '.result[0].id // empty')
          if [ -n "$ID" ]; then
            curl -fsS -X PUT  -H "$AUTH" -H 'Content-Type: application/json' "$Z/$ID" -d "$BODY" >/dev/null
          else
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' "$Z" -d "$BODY" >/dev/null
          fi
          echo "DNS $TYPE $HOST -> $CONTENT (proxied)"

      - name: Smoke test
        run: |
          code=$(curl -sS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors -w '%{http_code}' "https://$HOST/" || true)
          echo "https://$HOST -> HTTP $code"
          echo "### Deployed ${{ inputs.target }}: https://$HOST (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/bundle" ~/.ssh/deploy ~/.ssh/deploy.pub ~/.ssh/deploy-cert.pub
