# Tests for infra's own code: the dependency update engine (updates/), offline.
name: CI
on:
  push:
  pull_request:
permissions: { contents: read }
jobs:
  updates-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # yq (preinstalled on GitHub's Ubuntu runners) reads the YAML.
      - run: yq --version && python3 --version
      - run: python3 -m unittest discover -s updates/tests -v
